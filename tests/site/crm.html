<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Contacts · Acme CRM</title>
<style>
  body { font: 15px system-ui; margin: 0; }
  header { display: flex; gap: 16px; align-items: center; padding: 14px 24px; border-bottom: 1px solid #ddd; }
  main { padding: 24px; }
  #dlg { display: none; margin-top: 20px; padding: 20px; border: 1px solid #ccc; border-radius: 10px; max-width: 420px; }
  #dlg.open { display: block; }
  label { display: block; margin: 10px 0 4px; }
  .spinner { width: 28px; height: 28px; border-radius: 50%; border: 4px solid #ddd; border-top-color: #6366f1; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <header><b>Acme CRM</b><a id="reports" href="/reports.html">Reports</a></header>
  <main>
    <h1>Contacts</h1>
    <div id="slot"><button id="new" type="button">New contact</button></div>
    <form id="dlg" aria-label="New contact">
      <label for="name">Full name</label>
      <input id="name" name="fullname" required />
      <label for="stage">Stage</label>
      <select id="stage" name="stage"><option>Lead</option><option>Customer</option><option>Partner</option></select>
      <label><input id="vip" type="checkbox" /> VIP customer</label>
      <p><button id="save" type="submit">Save contact</button></p>
    </form>
    <p id="status"></p>
  </main>
  <script>
    // Test switches: ?slow=1 (the button appears after a few seconds, with a spinner),
    // ?renamed=1 (the button got a new id), ?open=1 (the form is already open and filled in).
    const q = new URLSearchParams(location.search)
    window.saves = 0
    const dlg = document.getElementById('dlg')
    const wire = () => document.getElementById('new')?.addEventListener('click', () => dlg.classList.add('open'))
    if (q.has('renamed')) document.getElementById('new').id = 'add-contact'
    document.getElementById(q.has('renamed') ? 'add-contact' : 'new').addEventListener('click', () => dlg.classList.add('open'))
    if (q.has('slow')) {
      const slot = document.getElementById('slot')
      const btn = slot.firstElementChild
      slot.replaceChildren(Object.assign(document.createElement('div'), { className: 'spinner', role: 'progressbar' }))
      setTimeout(() => slot.replaceChildren(btn), 6000)
    }
    if (q.has('open')) {
      document.getElementById('slot').remove()
      dlg.classList.add('open')
      document.getElementById('name').value = 'Jordan Lee'
    }
    dlg.addEventListener('submit', (e) => {
      e.preventDefault()
      window.saves++
      document.getElementById('status').textContent = 'Saved!'
    })
  </script>
</body>
</html>
