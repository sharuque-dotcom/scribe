<!doctype html><html><head><meta charset="utf-8"><title>Sign in · Projectly</title>
<style>body{font:15px system-ui;background:#f1f5f9;margin:0;display:grid;place-items:center;height:100vh}
form{background:#fff;padding:32px;border-radius:12px;width:340px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
label{display:block;font-weight:600;margin:14px 0 6px}input[type=email],input[type=password]{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:8px}
button{margin-top:18px;width:100%;padding:11px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600}</style></head>
<body><form action="dashboard.html"><h2>Sign in to Projectly</h2>
<label for="email">Work email</label><input id="email" name="email" type="email">
<label for="pw">Password</label><input id="pw" name="password" type="password">
<label style="font-weight:400"><input type="checkbox" id="remember"> Keep me signed in</label>
<button type="submit">Sign in</button></form></body></html>
