<!doctype html><html><head><meta charset="utf-8"><title>Dashboard · Projectly</title>
<style>body{font:15px system-ui;margin:0;background:#f8fafc}header{background:#0f172a;color:#fff;padding:14px 24px;display:flex;gap:24px}
header a{color:#cbd5e1;text-decoration:none}main{padding:28px}button{padding:10px 16px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:600}
dialog{border:0;border-radius:12px;padding:24px;width:380px;box-shadow:0 20px 50px rgba(0,0,0,.2)}label{display:block;font-weight:600;margin:12px 0 6px}
input,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:8px}</style></head>
<body><header><strong>Projectly</strong><a href="#">Projects</a><a href="#">Team</a><a href="#">Billing</a></header>
<main><h1>Projects</h1><p>You have no projects yet.</p><button id="new">New project</button></main>
<dialog id="dlg"><h3>Create project</h3>
<label for="pname">Project name</label><input id="pname">
<label for="ptype">Template</label><select id="ptype"><option>Blank</option><option>Marketing launch</option><option>Product roadmap</option></select>
<button id="create" style="margin-top:18px">Create project</button></dialog>
<script>new_ = document.getElementById('new');new_.onclick=()=>document.getElementById('dlg').showModal();
document.getElementById('create').onclick=()=>{document.getElementById('dlg').close();document.querySelector('main p').textContent='Project "'+document.getElementById('pname').value+'" created.'}</script>
</body></html>
